<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OppuCalc — Sri Lanka deed & stamp duty calculator</title>
<meta name="description" content="Sri Lanka deed stamp duty calculator — Sinhala, English, Tamil">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

const RATES = {
  transfer: { firstLimit: 100000, firstRate: 3, restRate: 4 },

<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#1d2433; --muted:#5d6577; --line:#e4dfd6;
  --accent:#9a3412; --accent-soft:#fdf0e7; --gold:#b7791f; --ok:#166534; --ok-soft:#e8f5ec;
  --warn:#9f1239; --warn-soft:#fdecef; --field:#fbfaf7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --card:#1d2029; --ink:#eceef3; --muted:#a2a8b6; --line:#2e3240;
    --accent:#f0905a; --accent-soft:#3a2418; --gold:#e3b04b; --ok:#6fcf8f; --ok-soft:#173023;
    --warn:#f28aa0; --warn-soft:#3a1a22; --field:#171a22;
  }
}
:root[data-theme="dark"]{
  --bg:#14161c; --card:#1d2029; --ink:#eceef3; --muted:#a2a8b6; --line:#2e3240;
  --accent:#f0905a; --accent-soft:#3a2418; --gold:#e3b04b; --ok:#6fcf8f; --ok-soft:#173023;
  --warn:#f28aa0; --warn-soft:#3a1a22; --field:#171a22;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Inter","Noto Sans Sinhala","Noto Sans Tamil",system-ui,sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
body.lang-si{font-family:"Noto Sans Sinhala","Inter",system-ui,sans-serif}
body.lang-ta{font-family:"Noto Sans Tamil","Inter",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.brand h1{margin:0;font-size:clamp(1.4rem,3.5vw,2rem);line-height:1.25;letter-spacing:-.01em}
.brand p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.langs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;flex-shrink:0}
.langs button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:.9rem;font-weight:600;
  padding:7px 14px;border-radius:999px;cursor:pointer
}
.langs button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .langs button[aria-pressed="true"]{color:#1a1a1a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .langs button[aria-pressed="true"]{color:#1a1a1a}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.card h2{margin:0 0 14px;font-size:1.08rem}
label.lbl{display:block;font-weight:600;font-size:.95rem;margin-bottom:8px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.seg button{
  font:inherit;text-align:left;padding:14px;border-radius:12px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--field);color:var(--ink)
}
.seg button strong{display:block;font-size:.98rem}
.seg button span{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.money{position:relative}
.money .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money input{
  width:100%;font:inherit;font-size:1.35rem;font-weight:700;padding:14px 14px 14px 52px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);outline:none
}
.money input:focus{border-color:var(--accent)}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.lakh{color:var(--gold);font-weight:600;font-size:.9rem;margin-top:6px;min-height:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{
  font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:6px 12px;border-radius:999px;cursor:pointer
}
.chips button:hover{border-color:var(--accent)}

.result{background:var(--ink);color:var(--bg);border-radius:16px;padding:22px;margin-bottom:18px}
.result .k{font-size:.9rem;opacity:.75}
.result .big{font-size:clamp(1.9rem,6vw,2.7rem);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:4px 0 10px;word-break:break-word}
.result .meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.92rem;opacity:.9}

table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:.85rem}
tfoot td{font-weight:700;border-bottom:0}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp div{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--field)}
.cmp div.on{border-color:var(--accent)}
.cmp small{color:var(--muted);display:block}
.cmp b{font-size:1.15rem}
.save{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:.92rem}

details summary{cursor:pointer;font-weight:700;font-size:1.05rem;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--accent)}
details[open] summary::before{content:"▾ "}
.risk{margin-top:14px;border-radius:12px;padding:14px;background:var(--warn-soft);color:var(--warn)}
.risk.okk{background:var(--ok-soft);color:var(--ok)}
.risk .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.risk .row.tot{border-top:1px solid currentColor;margin-top:6px;padding-top:8px;font-weight:700}

.sum{border:1.5px solid var(--accent)}
.srow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow b{text-align:right;white-space:nowrap}
.srow.tot{border-bottom:0;padding-top:14px;font-size:1.15rem}
.srow.tot b{color:var(--accent);font-size:1.35rem}
.seg button[data-fee]{text-align:center}
ul.tips{margin:0;padding-left:20px}
ul.tips li{margin-bottom:6px}
.note{font-size:.85rem;color:var(--muted)}
footer{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:8px}
footer button{font:inherit;font-size:.82rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer;margin-top:10px}

@media (max-width:560px){
  .seg,.cmp{grid-template-columns:1fr}
  .card,.result{padding:18px}
  th,td{padding:9px 4px;font-size:.88rem}
}
@media print{
  .langs,.chips,footer button{display:none}
  .result{background:#fff;color:#000;border:1px solid #000}
}
</style>
</head>
<body class="lang-si">
<div class="wrap">
  <header>
    <div class="brand">
      <h1 data-t="title"></h1>
      <p data-t="subtitle"></p>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="si">සිංහල</button>
      <button data-lang="en">English</button>
      <button data-lang="ta">தமிழ்</button>
    </div>
  </header>

  <section class="card">
    <label class="lbl" data-t="deedType"></label>
    <div class="seg" role="group">
      <button data-type="transfer"><strong data-t="transfer"></strong><span data-t="transferRate"></span></button>
      <button data-type="gift"><strong data-t="gift"></strong><span data-t="giftRate"></span></button>
    </div>

    <label class="lbl" for="val" data-t="value"></label>
    <div class="money">
      <span class="pre" data-t="rs"></span>
      <input id="val" inputmode="numeric" autocomplete="off" placeholder="5,000,000">
    </div>
    <div class="lakh" id="lakh"></div>
    <div class="chips" id="chips"></div>
    <p class="hint" data-t="valueHint"></p>
  </section>

  <section class="result" aria-live="polite">
    <div class="k" data-t="total"></div>
    <div class="big" id="total">—</div>
    <div class="meta">
      <span><span data-t="effective"></span>: <b id="eff">—</b></span>
      <span><span data-t="deedTypeShort"></span>: <b id="typeName">—</b></span>
    </div>
  </section>

  <section class="card">
    <h2 data-t="feeTitle"></h2>
    <div class="seg" role="group" style="margin-bottom:16px">
      <button data-fee="pct"><strong data-t="feePct"></strong></button>
      <button data-fee="fixed"><strong data-t="feeFixed"></strong></button>
    </div>
    <label class="lbl" for="fee" id="feeLbl"></label>
    <div class="money">
      <span class="pre" id="feePre"></span>
      <input id="fee" inputmode="decimal" autocomplete="off">
    </div>
    <div class="lakh" id="feeCalc"></div>
    <p class="hint" data-t="feeHint"></p>
  </section>

  <section class="card sum">
    <h2 data-t="grandTitle"></h2>
    <div class="srow"><span data-t="landValue"></span><b id="sLand">—</b></div>
    <div class="srow"><span data-t="stampDuty"></span><b id="sDuty">—</b></div>
    <div class="srow"><span data-t="lawyerFee"></span><b id="sFee">—</b></div>
    <div class="srow tot"><span data-t="grandTotal"></span><b id="sTotal">—</b></div>
    <p class="note" id="sExtra"></p>
  </section>

  <section class="card">
    <h2 data-t="breakdown"></h2>
    <table>
      <thead><tr><th data-t="portion"></th><th data-t="rate"></th><th data-t="duty"></th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot><tr><td data-t="totalShort"></td><td></td><td id="footTotal">—</td></tr></tfoot>
    </table>
    <p class="note" data-t="roundNote"></p>
  </section>

  <section class="card">
    <h2 data-t="compare"></h2>
    <div class="cmp">
      <div id="cT"><small data-t="transfer"></small><b id="cTv">—</b></div>
      <div id="cG"><small data-t="gift"></small><b id="cGv">—</b></div>
    </div>
    <div class="save" id="save" hidden></div>
  </section>

  <section class="card">
    <details>
      <summary data-t="underTitle"></summary>
      <p class="hint" data-t="underIntro"></p>
      <label class="lbl" for="decl" style="margin-top:12px" data-t="declared"></label>
      <div class="money">
        <span class="pre" data-t="rs"></span>
        <input id="decl" inputmode="numeric" autocomplete="off" placeholder="2,000,000">
      </div>
      <div class="risk" id="risk" hidden></div>
    </details>
  </section>

  <section class="card">
    <h2 data-t="tipsTitle"></h2>
    <ul class="tips" id="tips"></ul>
  </section>

  <footer>
    <div data-t="disclaimer"></div>
    <button onclick="window.print()" data-t="print"></button>
  </footer>
</div>

const PRESETS = [1000000, 2500000, 5000000, 10000000, 25000000];
const state = { lang:"si", type:"transfer", feeMode:"pct" };
try { const s = JSON.parse(localStorage.getItem("deedcalc")||"{}"); Object.assign(state, s); } catch(e){}

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("en-LK");
const parse = s => { const n = parseFloat(String(s).replace(/[^\d.]/g,"")); return isFinite(n) ? n : 0; };

function duty(value, type){
  const r = RATES[type], step = RATES.roundTo;
  if (value <= 0) return { total:0, rows:[] };
  const units = v => Math.ceil(v/step) * step;
  if (value <= r.firstLimit){
    const d = units(value) * r.firstRate / 100;
    return { total:d, rows:[{ k:"whole", amt:value, rate:r.firstRate, d }] };
  }
  const d1 = r.firstLimit * r.firstRate / 100;
  const bal = value - r.firstLimit;
  const d2 = units(bal) * r.restRate / 100;
  return { total:d1+d2, rows:[
    { k:"first", amt:r.firstLimit, rate:r.firstRate, d:d1 },
    { k:"balance", amt:bal, rate:r.restRate, d:d2 }
  ]};
}

function save(){ try { localStorage.setItem("deedcalc", JSON.stringify({lang:state.lang,type:state.type,feeMode:state.feeMode})); } catch(e){} }

function applyLang(){
  const L = T[state.lang];
  document.documentElement.lang = state.lang;
  document.body.className = "lang-" + state.lang;
  document.title = L.title;
  document.querySelectorAll("[data-t]").forEach(el => { const v = L[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === state.lang));
  $("tips").innerHTML = L.tips.map(t => `<li>${t}</li>`).join("");
  $("chips").innerHTML = PRESETS.map(p => `<button data-v="${p}">${L.lakh(p/100000).replace("≈ ","")}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b => b.onclick = () => { $("val").value = fmt(+b.dataset.v); calc(); });
  calc();
}

function calc(){
  const L = T[state.lang];
  document.querySelectorAll("[data-type]").forEach(b => b.setAttribute("aria-pressed", b.dataset.type === state.type));
  const v = parse($("val").value);
  $("lakh").textContent = v >= 100000 ? L.lakh((v/100000).toLocaleString("en-LK",{maximumFractionDigits:2})) : "";

  const res = duty(v, state.type);
  $("total").textContent = v ? `${L.rs} ${fmt(res.total)}` : "—";
  $("footTotal").textContent = v ? `${L.rs} ${fmt(res.total)}` : "—";
  $("eff").textContent = v ? (res.total / v * 100).toFixed(2) + "%" : "—";
  $("typeName").textContent = L[state.type];
  $("rows").innerHTML = res.rows.map(r =>
    `<tr><td>${L[r.k](fmt(r.amt))}</td><td>${r.rate}%</td><td>${L.rs} ${fmt(r.d)}</td></tr>`).join("")
    || `<tr><td colspan="3" style="text-align:center;color:var(--muted)">—</td></tr>`;

  const t = duty(v,"transfer").total, g = duty(v,"gift").total;
  $("cTv").textContent = v ? `${L.rs} ${fmt(t)}` : "—";
  $("cGv").textContent = v ? `${L.rs} ${fmt(g)}` : "—";
  $("cT").classList.toggle("on", state.type==="transfer");
  $("cG").classList.toggle("on", state.type==="gift");
  $("save").hidden = !(v && t > g);
  $("save").textContent = L.saving(fmt(t-g));

  // Lawyer fee + grand total
  document.querySelectorAll("[data-fee]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fee === state.feeMode));
  const pct = state.feeMode === "pct";
  $("feeLbl").textContent = pct ? L.feePctLbl : L.feeFixedLbl;
  $("feePre").textContent = pct ? "%" : L.rs;
  $("fee").placeholder = pct ? "1.5" : "75,000";
  const fRaw = parse($("fee").value);
  const fee = pct ? v * Math.min(fRaw, 100) / 100 : fRaw;
  $("feeCalc").textContent = pct && fee ? `= ${L.rs} ${fmt(fee)}` : "";
  $("sLand").textContent = v ? `${L.rs} ${fmt(v)}` : "—";
  $("sDuty").textContent = v ? `${L.rs} ${fmt(res.total)}` : "—";
  $("sFee").textContent = `${L.rs} ${fmt(fee)}`;
  $("sTotal").textContent = (v || fee) ? `${L.rs} ${fmt(v + res.total + fee)}` : "—";
  $("sExtra").textContent = v ? L.extra(fmt(res.total + fee)) : "";

  const d = parse($("decl").value), risk = $("risk");
  if (!v || !d){ risk.hidden = true; return; }
  risk.hidden = false;
  if (d >= v){ risk.className = "risk okk"; risk.textContent = L.noShort; return; }
  const paid = duty(d, state.type).total, short = res.total - paid, pen = short * RATES.penaltyMax / 100;
  risk.className = "risk";
  risk.innerHTML =
    `<div class="row"><span>${L.total}</span><span>${L.rs} ${fmt(res.total)}</span></div>
     <div class="row"><span>${L.paid}</span><span>− ${L.rs} ${fmt(paid)}</span></div>
     <div class="row"><span>${L.shortfall}</span><span>${L.rs} ${fmt(short)}</span></div>
     <div class="row"><span>${L.penalty}</span><span>+ ${L.rs} ${fmt(pen)}</span></div>
     <div class="row tot"><span>${L.exposure}</span><span>${L.rs} ${fmt(short+pen)}</span></div>`;
}

function liveFormat(el){
  el.addEventListener("input", () => {
    if (el.id === "fee" && state.feeMode === "pct") return;
    const pos = el.value.length - el.selectionStart;
    const digits = el.value.replace(/[^\d]/g,"");
    el.value = digits ? fmt(+digits) : "";
    const p = Math.max(0, el.value.length - pos);
    try { el.setSelectionRange(p,p); } catch(e){}
    calc();
  });
}

document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { state.lang = b.dataset.lang; save(); applyLang(); });
document.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { state.type = b.dataset.type; save(); calc(); });
liveFormat($("val")); liveFormat($("decl"));
$("fee").addEventListener("input", () => {
  const el = $("fee");
  if (state.feeMode === "pct"){
    let s = el.value.replace(/[^\d.]/g,"").replace(/(\..*)\./g,"$1");
    if (parseFloat(s) > 100) s = "100";
    el.value = s; calc();
  }
});
liveFormat($("fee"));
document.querySelectorAll("[data-fee]").forEach(b => b.onclick = () => {
  if (state.feeMode !== b.dataset.fee){ state.feeMode = b.dataset.fee; $("fee").value = ""; save(); calc(); }
});
$("val").value = fmt(5000000);
applyLang();
</script>
